name: Production Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Version Match
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content frontend/package.json | ConvertFrom-Json).version
          $tagVersion = $tag.TrimStart('v')
          if ($tagVersion -ne $version) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but frontend/package.json version is '$version'."
              exit 1
          }
          $pyLine = Get-Content pyproject.toml | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1
          $pyVersion = ($pyLine -replace '.*"([^"]+)".*', '$1')
          if ($tagVersion -ne $pyVersion) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but pyproject.toml version is '$pyVersion'."
              exit 1
          }
          $tauriVersion = (Get-Content frontend/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $tauriVersion) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but src-tauri/tauri.conf.json version is '$tauriVersion'."
              exit 1
          }
          $cargoVersion = (Select-String -Path frontend/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tagVersion -ne $cargoVersion) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but src-tauri/Cargo.toml version is '$cargoVersion'."
              exit 1
          }
          $appVersion = (Select-String -Path backend/config.py -Pattern '^APP_VERSION[^"]*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tagVersion -ne $appVersion) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but backend/config.py APP_VERSION is '$appVersion'."
              exit 1
          }
          Write-Host "Version verification successful: tag '$tag' matches package.json, pyproject.toml, tauri.conf.json, Cargo.toml, and APP_VERSION ('$version')."

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri


      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies (Virtual Env)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Production Dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Native C++ WPD Helper
        working-directory: frontend
        run: npm run build:native

      - name: Pre-seed ExifTool (offline installer support)
        # Downloads ExifTool into backend/bin/exiftool/ so the Tauri
        # resource-staging step below can ship the entire runtime tree inside
        # the installer. First-run download remains as fallback. Fail-closed:
        # a release without ExifTool would silently regress offline installs.
        # NOTE: ExifTool v13.59+ ships as a stub exe + exiftool_files/ Perl
        # runtime tree (no longer a single standalone file). Both must be
        # staged into resources/ for the launcher to work.
        run: |
          .venv\Scripts\python -c "from backend.engines.metadata_extractor import _download_exiftool; import sys; p=_download_exiftool('backend/bin/exiftool'); print('preseded:', p); sys.exit(0 if p and p.is_file() else 1)"
          if (Test-Path backend/bin/exiftool/exiftool.exe) { Write-Host "ExifTool pre-seed verified." } else { Write-Error "ExifTool pre-seed missing!"; exit 1 }

      - name: Pre-seed AI models (offline installer support)
        # Downloads the 5 on-board AI model files into backend/data/models/
        # so the resource-staging step below can ship them inside the
        # installer. First-run download remains as fallback. Fail-closed:
        # a release without models would silently ship a model-less
        # installer (~400 MB of weights must be present).
        # Canonical names/URLs mirror backend/engines/clip.py MODEL_SPECS
        # and backend/engines/intelligence.py FACE_MODEL_SPECS.
        run: |
          $modelsDir = "backend/data/models"
          New-Item -ItemType Directory -Path $modelsDir -Force | Out-Null
          $files = @(
            @{ Name = "mobileclip_s0_image.onnx"; Url = "https://huggingface.co/Xenova/mobileclip_s0/resolve/main/onnx/vision_model.onnx"; Expected = 45500000 },
            @{ Name = "mobileclip_s0_text.onnx"; Url = "https://huggingface.co/Xenova/mobileclip_s0/resolve/main/onnx/text_model.onnx"; Expected = 170000000 },
            @{ Name = "mobileclip_s0_tokenizer.json"; Url = "https://huggingface.co/Xenova/mobileclip_s0/resolve/main/tokenizer.json"; Expected = 2200000 },
            @{ Name = "scrfd_10g.onnx"; Url = "https://huggingface.co/DavidHoa/buffalo_l/resolve/9d7dfbba11e47cf2bf1aa92eb61f53172aae07e9/det_10g.onnx"; Expected = 16000000 },
            @{ Name = "arcface_r50.onnx"; Url = "https://huggingface.co/DavidHoa/buffalo_l/resolve/9d7dfbba11e47cf2bf1aa92eb61f53172aae07e9/w600k_r50.onnx"; Expected = 166000000 }
          )
          foreach ($f in $files) {
            $dest = Join-Path $modelsDir $f.Name
            if (-not (Test-Path $dest)) {
              Write-Host "Downloading $($f.Name) from $($f.Url) ..."
              Invoke-WebRequest -Uri $f.Url -OutFile $dest -UseBasicParsing
            } else {
              Write-Host "$($f.Name) already present, verifying size."
            }
          }
          foreach ($f in $files) {
            $dest = Join-Path $modelsDir $f.Name
            if (-not (Test-Path $dest)) { Write-Error "$($f.Name) pre-seed missing!"; exit 1 }
            $size = (Get-Item $dest).Length
            if ($size -lt 1MB) { Write-Error "$($f.Name) suspiciously small ($size bytes)!"; exit 1 }
            if (($size -lt ($f.Expected / 2)) -or ($size -gt ($f.Expected * 2))) { Write-Error "$($f.Name) size $size bytes outside 0.5x-2x of expected $($f.Expected)!"; exit 1 }
            Write-Host "$($f.Name) verified ($([math]::Round($size/1MB,1)) MB)."
          }
          Write-Host "AI model pre-seed verified."

      - name: Prepare Code Signing
        # Exports the cert for a Tauri `bundle.windows.signCommand` wired at
        # release time (follow-up with the updater work). Unsigned builds
        # still package fine — Windows shows the standard unknown-publisher
        # prompt covered in the README.
        shell: bash
        run: |
          if [ ! -z "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Code signing certificate secrets found. App will be signed."
          else
            echo "No code signing secrets found. App will be packaged unsigned."
          fi

      - name: Freeze Python Sidecar (Tauri backend)
        # PyInstaller one-dir → mirrored as
        # frontend/src-tauri/resources/transfera-engine/ (Tauri *resources*
        # layout). The bundle must ship whole (exe + _internal/): externalBin
        # only supports single files, and an exe without its runtime dies on
        # launch with "Failed to load Python DLL". Fail-closed: no sidecar,
        # no Tauri build.
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-sidecar.ps1
          $engineExe = "frontend/src-tauri/resources/transfera-engine/transfera-engine.exe"
          $engineInternal = "frontend/src-tauri/resources/transfera-engine/_internal"
          if (-not (Test-Path $engineExe)) { Write-Error "Sidecar engine missing!"; exit 1 }
          $stagedCount = @(Get-ChildItem -Path $engineInternal -Recurse -File -ErrorAction SilentlyContinue).Count
          if ($stagedCount -lt 10) { Write-Error "Sidecar _internal runtime incomplete ($stagedCount files)!"; exit 1 }
          Write-Host "Sidecar staged: $engineExe ($([math]::Round((Get-Item $engineExe).Length/1MB,1)) MB exe, $stagedCount runtime files)"

      - name: Stage Tauri Resources (wpd_helper + ExifTool runtime + AI models)
        # resources/ holds the runtime helper binaries the frozen sidecar
        # resolves via backend.config.SIDECAR_RESOURCE_DIR.
        # ExifTool v13.59+ ships as a stub exe + exiftool_files/ Perl runtime
        # tree — both must land in resources/ for the launcher to work.
        # The 5 on-board AI model files (~400 MB, pre-seeded above) ship as
        # resources/models/ so first launch works fully offline.
        # The smoke test runs the staged exe to confirm it resolves its runtime.
        # NOTE: resources/ and binaries/ are gitignored (*.exe excluded) so
        # they don't exist after a fresh checkout — create them first.
        run: |
          New-Item -ItemType Directory -Path frontend/src-tauri/resources -Force | Out-Null
          Copy-Item backend/bin/wpd_helper.exe frontend/src-tauri/resources/wpd_helper.exe -Force
          Copy-Item backend/bin/exiftool/exiftool.exe frontend/src-tauri/resources/exiftool.exe -Force
           if (Test-Path backend/bin/exiftool/exiftool_files) {
             # Trailing /* copies the tree *contents*: without it Copy-Item
             # nests the container when the dest dir already exists
             # (fresh clones carry it with .gitkeep), breaking the stub's
             # perl5*.dll lookup.
             New-Item -ItemType Directory -Path frontend/src-tauri/resources/exiftool_files -Force | Out-Null
             Copy-Item backend/bin/exiftool/exiftool_files/* frontend/src-tauri/resources/exiftool_files -Recurse -Force
           }
          & frontend/src-tauri/resources/exiftool.exe -ver
          if ($LASTEXITCODE -ne 0) { Write-Error "ExifTool smoke test failed!"; exit 1 }
          New-Item -ItemType Directory -Path frontend/src-tauri/resources/models -Force | Out-Null
          Copy-Item backend/data/models/mobileclip_s0_image.onnx frontend/src-tauri/resources/models/ -Force
          Copy-Item backend/data/models/mobileclip_s0_text.onnx frontend/src-tauri/resources/models/ -Force
          Copy-Item backend/data/models/mobileclip_s0_tokenizer.json frontend/src-tauri/resources/models/ -Force
          Copy-Item backend/data/models/scrfd_10g.onnx frontend/src-tauri/resources/models/ -Force
          Copy-Item backend/data/models/arcface_r50.onnx frontend/src-tauri/resources/models/ -Force
          $modelFiles = @("mobileclip_s0_image.onnx", "mobileclip_s0_text.onnx", "mobileclip_s0_tokenizer.json", "scrfd_10g.onnx", "arcface_r50.onnx")
          $modelTotal = 0
          foreach ($m in $modelFiles) {
            $p = Join-Path "frontend/src-tauri/resources/models" $m
            if (-not (Test-Path $p)) { Write-Error "Staged model missing: $m!"; exit 1 }
            $len = (Get-Item $p).Length
            if ($len -eq 0) { Write-Error "Staged model empty: $m!"; exit 1 }
            $modelTotal += $len
          }
          if ($modelTotal -lt 300MB) { Write-Error "Staged models total too small ($([math]::Round($modelTotal/1MB,1)) MB, expected >300MB)!"; exit 1 }
          Write-Host "AI models staged: 5 files, $([math]::Round($modelTotal/1MB,1)) MB total."
          if ((Get-Item frontend/src-tauri/resources/wpd_helper.exe).Length -eq 0) { Write-Error "wpd_helper.exe staging is empty!"; exit 1 }
          Write-Host "Tauri resources staged and verified."

      - name: Check Rust (fmt + clippy)
        working-directory: frontend/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings

      - name: Build and Package Tauri App
        working-directory: frontend
        run: npm run tauri:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate and Verify SHA256 Checksums
        shell: pwsh
        run: |
          $releaseDir = "frontend/release"
          $tauriBundleDir = "frontend/src-tauri/target/release/bundle"
          # The release dir is gitignored and never checked out — create it
          # before collecting (Copy-Item fails with "could not find a part
          # of the path" otherwise).
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          
          # Collect the Tauri installer, updater zip, signature, and manifest
          $assets = Get-ChildItem -Path $tauriBundleDir -Include "*.exe", "*.zip", "*.sig", "latest.json" -File -Recurse -ErrorAction SilentlyContinue
          $assets | ForEach-Object { Copy-Item $_.FullName (Join-Path $releaseDir $_.Name) -Force; Write-Host "Collected release asset: $($_.Name)" }
          
          $files = @()
          $files += Get-ChildItem -Path $releaseDir -Include "Transfera_*-setup.exe" -File -Recurse -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) {
              Write-Error "No release executables found in $releaseDir (or $tauriBundleDir)"
              exit 1
          }
          
          Write-Host "Found binaries to hash:"
          $files | ForEach-Object { Write-Host " - $($_.Name)" }
          
          # Generate hashes in standard GNU format: <hash>  <filename>
          $hashes = $files | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              $name = $_.Name
              "$hash  $name"
          }
          
          $sumsPath = Join-Path $releaseDir "SHA256SUMS.txt"
          $hashes | Out-File -FilePath $sumsPath -Encoding ascii
          Write-Host "Generated SHA256SUMS.txt successfully."
          
          # Verify hashes in CI before uploading
          Write-Host "Verifying generated checksums..."
          Get-Content $sumsPath | ForEach-Object {
              if ($_ -match '^([a-f0-9]{64})\s+(.+)$') {
                  $expectedHash = $Matches[1]
                  $file = $Matches[2]
                  $filePath = Join-Path $releaseDir $file
                  $actualHash = (Get-FileHash -Path $filePath -Algorithm SHA256).Hash.ToLower()
                  if ($actualHash -eq $expectedHash) {
                      Write-Host "Verification succeeded for $file ($actualHash)"
                  } else {
                      Write-Error "Hash verification failed for $file! Expected: $expectedHash, Got: $actualHash"
                      exit 1
                  }
              }
          }

      - name: Generate Updater Manifest (latest.json)
        # The v2 updater installs the full NSIS installer directly (no zip
        # wrapping): latest.json points url at the setup.exe and carries the
        # .sig content VERBATIM (single-line base64 blob starting
        # "dW50cnVzdGVk..."). Never base64-decode it: the plugin decodes the
        # field itself, and embedding decoded minisign text ("untrusted
        # comment: ...") fails verification with "Invalid symbol 32"
        # (32 = ASCII space at offset 9 in "untrusted comment:").
        # Fails loudly when the .sig is missing or malformed so we never
        # publish a release the in-app updater cannot use.
        shell: pwsh
        run: |
          $releaseDir = "frontend/release"
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $exe = Get-ChildItem -Path $releaseDir -Filter "Transfera_*-setup.exe" -File | Select-Object -First 1
          if (-not $exe) { Write-Error "No setup exe found for updater manifest"; exit 1 }
          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) { Write-Error "Missing updater signature $($exe.Name).sig"; exit 1 }
          $sigText = (Get-Content $sigPath -Raw).Trim()
          if ($sigText -notmatch '^[A-Za-z0-9+/=]+$') { Write-Error "Updater signature is not a single-line base64 blob (do not decode the .sig file)"; exit 1 }
          $url = "https://github.com/R1sh1m/Transfera/releases/download/$tag/$($exe.Name)"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $platform = [ordered]@{ signature = $sigText; url = $url }
          $manifest = [ordered]@{
            version = $version
            notes = "Transfera $version"
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = $platform
              "windows-x86_64-nsis" = $platform
            }
          }
          $out = Join-Path $releaseDir "latest.json"
          ($manifest | ConvertTo-Json -Depth 5) | Set-Content -Path $out -Encoding utf8NoBOM
          Write-Host "Wrote $out for version $version"
          Get-Content $out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/release/Transfera_*-setup.exe
            frontend/release/Transfera_*.zip
            frontend/release/Transfera_*.sig
            frontend/release/latest.json
            frontend/release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
