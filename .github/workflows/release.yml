name: Production Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Version Match
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content frontend/package.json | ConvertFrom-Json).version
          $tagVersion = $tag.TrimStart('v')
          if ($tagVersion -ne $version) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but frontend/package.json version is '$version'."
              exit 1
          }
          $pyLine = Get-Content pyproject.toml | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1
          $pyVersion = ($pyLine -replace '.*"([^"]+)".*', '$1')
          if ($tagVersion -ne $pyVersion) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but pyproject.toml version is '$pyVersion'."
              exit 1
          }
          $wingetLine = Get-Content winget/Transfera.Transfera.yaml | Where-Object { $_ -match '^PackageVersion:' } | Select-Object -First 1
          $wingetVersion = ($wingetLine -replace '^PackageVersion:\s*', '').Trim()
          if ($tagVersion -ne $wingetVersion) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but winget PackageVersion is '$wingetVersion'."
              exit 1
          }
          $tauriVersion = (Get-Content frontend/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $tauriVersion) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but src-tauri/tauri.conf.json version is '$tauriVersion'."
              exit 1
          }
          $cargoVersion = (Select-String -Path frontend/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tagVersion -ne $cargoVersion) {
              Write-Error "Version mismatch! Git tag is '$tag' (parsed: '$tagVersion') but src-tauri/Cargo.toml version is '$cargoVersion'."
              exit 1
          }
          Write-Host "Version verification successful: tag '$tag' matches package.json, pyproject.toml, winget manifest, tauri.conf.json, and Cargo.toml ('$version')."

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri


      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies (Virtual Env)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r backend/requirements.txt

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Production Dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Native C++ WPD Helper
        working-directory: frontend
        run: npm run build:native

      - name: Pre-seed ExifTool (offline installer support)
        # Downloads ExifTool into backend/bin/exiftool/ so the Tauri
        # resource-staging step below can ship the single-file exe inside
        # the installer. First-run download remains as fallback. Fail-closed:
        # a release without ExifTool would silently regress offline installs.
        run: |
          .venv\Scripts\python -c "from backend.engines.metadata_extractor import _download_exiftool; import sys; p=_download_exiftool('backend/bin/exiftool'); print('preseded:', p); sys.exit(0 if p and p.is_file() else 1)"
          if (Test-Path backend/bin/exiftool/exiftool.exe) { Write-Host "ExifTool pre-seed verified." } else { Write-Error "ExifTool pre-seed missing!"; exit 1 }

      - name: Prepare Code Signing
        # Exports the cert for a Tauri `bundle.windows.signCommand` wired at
        # release time (follow-up with the updater work). Unsigned builds
        # still package fine — Windows shows the standard unknown-publisher
        # prompt covered in the README.
        shell: bash
        run: |
          if [ ! -z "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Code signing certificate secrets found. App will be signed."
          else
            echo "No code signing secrets found. App will be packaged unsigned."
          fi

      - name: Freeze Python Sidecar (Tauri backend)
        # PyInstaller one-dir → staged as
        # frontend/src-tauri/binaries/transfera-engine-<triple>.exe
        # (Tauri externalBin layout). Fail-closed: no sidecar, no Tauri build.
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-sidecar.ps1
          $staged = Get-ChildItem -Path frontend/src-tauri/binaries -Filter "transfera-engine-*.exe" -File
          if ($staged.Count -eq 0) { Write-Error "Sidecar staging missing!"; exit 1 }
          $staged | ForEach-Object { Write-Host "Sidecar staged: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Stage Tauri Resources (wpd_helper + single-file ExifTool)
        # resources/ holds the runtime helper binaries the frozen sidecar
        # resolves via backend.config.SIDECAR_RESOURCE_DIR. The ExifTool
        # smoke test is fail-closed: the single file must run standalone
        # (no unpacked Perl tree ships in the Tauri bundle).
        run: |
          Copy-Item backend/bin/wpd_helper.exe frontend/src-tauri/resources/wpd_helper.exe -Force
          Copy-Item backend/bin/exiftool/exiftool.exe frontend/src-tauri/resources/exiftool.exe -Force
          & frontend/src-tauri/resources/exiftool.exe -ver
          if ($LASTEXITCODE -ne 0) { Write-Error "Single-file ExifTool smoke test failed!"; exit 1 }
          if ((Get-Item frontend/src-tauri/resources/wpd_helper.exe).Length -eq 0) { Write-Error "wpd_helper.exe staging is empty!"; exit 1 }
          Write-Host "Tauri resources staged and verified."

      - name: Check Rust (fmt + clippy)
        working-directory: frontend/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings

      - name: Build and Package Tauri App
        working-directory: frontend
        run: npm run tauri:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and Verify SHA256 Checksums
        shell: pwsh
        run: |
          $releaseDir = "frontend/release"
          $tauriBundleDir = "frontend/src-tauri/target/release/bundle/nsis"
          # Collect the Tauri NSIS output. Its default name
          # (Transfera_<ver>_x64-setup.exe) is the only installer artifact.
          $tauriExes = Get-ChildItem -Path $tauriBundleDir -Include "*.exe" -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "Transfera*" }
          $tauriExes | ForEach-Object { Copy-Item $_.FullName (Join-Path $releaseDir $_.Name) -Force; Write-Host "Collected Tauri installer: $($_.Name)" }
          $files = @()
          $files += Get-ChildItem -Path $releaseDir -Include "Transfera_*-setup.exe" -File -Recurse -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) {
              Write-Error "No release executables found in $releaseDir (or $tauriBundleDir)"
              exit 1
          }
          
          Write-Host "Found binaries to hash:"
          $files | ForEach-Object { Write-Host " - $($_.Name)" }
          
          # Generate hashes in standard GNU format: <hash>  <filename>
          $hashes = $files | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              $name = $_.Name
              "$hash  $name"
          }
          
          $sumsPath = Join-Path $releaseDir "SHA256SUMS.txt"
          $hashes | Out-File -FilePath $sumsPath -Encoding ascii
          Write-Host "Generated SHA256SUMS.txt successfully."
          
          # Verify hashes in CI before uploading
          Write-Host "Verifying generated checksums..."
          Get-Content $sumsPath | ForEach-Object {
              if ($_ -match '^([a-f0-9]{64})\s+(.+)$') {
                  $expectedHash = $Matches[1]
                  $file = $Matches[2]
                  $filePath = Join-Path $releaseDir $file
                  $actualHash = (Get-FileHash -Path $filePath -Algorithm SHA256).Hash.ToLower()
                  if ($actualHash -eq $expectedHash) {
                      Write-Host "Verification succeeded for $file ($actualHash)"
                  } else {
                      Write-Error "Hash verification failed for $file! Expected: $expectedHash, Got: $actualHash"
                      exit 1
                  }
              }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/release/Transfera_*-setup.exe
            frontend/release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
