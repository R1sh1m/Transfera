# Transfera v2 — CI Pipeline
#
# Four parallel jobs: backend tests, frontend type-check, lint, and Rust
# (Tauri shell fmt + clippy + check on the Windows target).
# Target: under 5 minutes total (no Playwright / E2E yet).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

# ---------------------------------------------------------------------------
# Backend tests
# ---------------------------------------------------------------------------
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Frontend type-check
  # ---------------------------------------------------------------------------
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Type-check
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Lint (Python + Frontend)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---- Python lint (ruff) ------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip (ruff)
        uses: actions/cache@v4
        id: pip-cache-lint
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check backend/

      # ---- Frontend (TypeScript lint via tsc, plus eslint if available) -------
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm (lint)
        uses: actions/cache@v4
        id: npm-cache-lint
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-lint-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-lint-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Rust (Tauri shell) — fmt + clippy + check.
  # Windows runner: the shell is Windows-only (WPD/COM helpers, NSIS bundle)
  # and placeholder sidecar/resource exes are staged so the tauri build
  # script's existence checks pass without packaging real binaries.
  # ---------------------------------------------------------------------------
  rust-checks:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Stage placeholder sidecar + resources (existence checks only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path binaries, resources -Force | Out-Null
          foreach ($f in @("binaries/transfera-engine-x86_64-pc-windows-msvc.exe", "resources/wpd_helper.exe", "resources/exiftool.exe")) {
            if (-not (Test-Path $f)) { New-Item -ItemType File -Path $f -Force | Out-Null }
          }

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Check
        run: cargo check

  # ---------------------------------------------------------------------------
  # Dependency Review (PRs only)
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        # Non-blocking until the repo's dependency graph is enabled
        # (Settings → Security → Dependency graph). Fails closed otherwise.
        continue-on-error: true
