# Transfera v2 — CI Pipeline
#
# Six parallel jobs: backend tests, frontend type-check, lint, Rust
# (Tauri shell fmt + clippy + check on the Windows target), and
# script-checks (PS1 UTF-8 BOM + parse, bash shellcheck + CRLF).
# Target: under 5 minutes total (no Playwright / E2E yet).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

# ---------------------------------------------------------------------------
# Backend tests
# ---------------------------------------------------------------------------
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Frontend type-check
  # ---------------------------------------------------------------------------
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev

      - name: Type-check
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Lint (Python + Frontend)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---- Python lint (ruff) ------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip (ruff)
        uses: actions/cache@v4
        id: pip-cache-lint
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check backend/

      # ---- Frontend (TypeScript lint via tsc, plus eslint if available) -------
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm (lint)
        uses: actions/cache@v4
        id: npm-cache-lint
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-lint-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-lint-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend

  # ---------------------------------------------------------------------------
  # Rust (Tauri shell) — fmt + clippy + check.
  # Windows runner: the shell is Windows-only (WPD/COM helpers, NSIS bundle)
  # and placeholder sidecar/resource exes are staged so the tauri build
  # script's existence checks pass without packaging real binaries.
  # ---------------------------------------------------------------------------
  rust-checks:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend/src-tauri

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Stage placeholder sidecar + resources (existence checks only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path binaries, resources, ../dist -Force | Out-Null
          if (-not (Test-Path ../dist/index.html)) { New-Item -ItemType File -Path ../dist/index.html -Force | Out-Null }
          # Resource placeholders only (the sidecar ships as a resources/
          # folder now, and resource globs are validated at bundle time, not
          # compile time — nothing sidecar-shaped is needed for cargo check).
          foreach ($f in @("resources/wpd_helper.exe", "resources/exiftool.exe")) {
            if (-not (Test-Path $f)) { New-Item -ItemType File -Path $f -Force | Out-Null }
          }

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy -- -D warnings

      - name: Check
        run: cargo check

  # ---------------------------------------------------------------------------
  # Script checks — PS1 encoding/parse (Windows) + bash shellcheck (Linux)
  # ---------------------------------------------------------------------------
  script-checks:
    name: Script checks (PS1 + bash)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shard: powershell
          - os: ubuntu-latest
            shard: bash

    steps:
      - uses: actions/checkout@v4

      # ── PowerShell shard: UTF-8 BOM + parse ──────────────────────────────
      - name: Check PS1 files — UTF-8 BOM present
        if: matrix.shard == 'powershell'
        shell: pwsh
        run: |
          $failures = @()
          Get-ChildItem -Recurse -Filter "*.ps1" -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -notmatch '\\.venv\\' } |
            ForEach-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              # UTF-8 BOM = 0xEF 0xBB 0xBF
              if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
                $failures += $_.FullName
                Write-Host "::error file=$($_.FullName)::Missing UTF-8 BOM — PS5.1 will corrupt Unicode characters (em-dash, emoji, box-drawing). Re-save as UTF-8 with BOM."
              } else {
                Write-Host "OK (BOM present): $($_.FullName)"
              }
            }
          if ($failures.Count -gt 0) { exit 1 }

      - name: Check PS1 files — syntax parse
        if: matrix.shard == 'powershell'
        shell: pwsh
        run: |
          $anyFail = $false
          Get-ChildItem -Recurse -Filter "*.ps1" -File |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -notmatch '\\.venv\\' } |
            ForEach-Object {
              $errors = $null; $tokens = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$tokens, [ref]$errors
              )
              if ($errors.Count -gt 0) {
                $anyFail = $true
                foreach ($e in $errors) {
                  Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                }
              } else {
                Write-Host "OK (parse): $($_.FullName)"
              }
            }
          if ($anyFail) { exit 1 }

      # ── Bash shard: CRLF guard + shellcheck ──────────────────────────────
      - name: Check .sh files — no Windows CRLF line endings
        if: matrix.shard == 'bash'
        run: |
          any_fail=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q CRLF; then
              echo "::error file=${f}::Shell script has CRLF line endings — will fail on macOS/Linux with '\\r: command not found'. Convert to LF."
              any_fail=1
            else
              echo "OK (LF): $f"
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $any_fail

      - name: Check .sh files — bash syntax
        if: matrix.shard == 'bash'
        run: |
          any_fail=0
          while IFS= read -r -d '' f; do
            if bash -n "$f" 2>&1; then
              echo "OK (syntax): $f"
            else
              echo "::error file=${f}::bash -n reported syntax errors"
              any_fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $any_fail

      - name: Check .sh files — shellcheck
        if: matrix.shard == 'bash'
        run: |
          # shellcheck is pre-installed on ubuntu-latest GitHub runners
          any_fail=0
          while IFS= read -r -d '' f; do
            if shellcheck --severity=warning "$f"; then
              echo "OK (shellcheck): $f"
            else
              echo "::error file=${f}::shellcheck found warnings/errors"
              any_fail=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $any_fail

      - name: Check .sh files — executable bit
        if: matrix.shard == 'bash'
        run: |
          any_fail=0
          while IFS= read -r -d '' f; do
            if [ ! -x "$f" ]; then
              echo "::warning file=${f}::Shell script is not executable (chmod +x). Users will need to run it with 'bash $f' rather than './$f'."
            else
              echo "OK (executable): $f"
            fi
          done < <(find scripts/ -name '*.sh' -print0 2>/dev/null || true)
          # Not a hard fail — executable bit is lost on Windows checkouts
          exit 0

  # ---------------------------------------------------------------------------
  # Dependency Review (PRs only)
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        # Non-blocking until the repo's dependency graph is enabled
        # (Settings → Security → Dependency graph). Fails closed otherwise.
        continue-on-error: true
